[tool.poetry]
name = "uni-school"
version = "0.1.0"
description = ""
authors = ["Aleksey Zvyagintsev <alex0236889@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.2.8"
python-dotenv = "^1.1.1"
psycopg2-binary = "==2.9.11"
apscheduler = "==3.11.1"
django-apscheduler = "^0.7.0"
email-validator = "^2.3.0"
django-filter = ">=25.2,<26.0"
black = "==25.12.0"
mypy = "==1.19.1"
docutils = "==0.22.4"
djangorestframework-simplejwt = ">=5.5.1,<6.0.0"
django-cors-headers = ">=4.9.0,<5.0.0"
docutils-stubs = "==0.0.22"
types-docutils = "==0.22.3.20251115"
celery = ">=5.6.2,<6.0.0"
celery-types = "==0.24.0"
django-celery-beat = "^2.8.1"
drf-spectacular = "^0.29.0"
stripe = "^14.3.0"
pillow = "^12.1.1"
freezegun = "^1.5.5"
redis = "^7.1.1"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.1"
black = "^25.11.0"
isort = "7.0.0"
mypy = "^1.14.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ['venv', '.venv', 'tests', '__pycache__']
check_untyped_defs = true
strict = true
warn_unreachable = true

[tool.isort]
line_length = 119
multi_line_output = 1

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.mypy_cache
    | \.venv
  )/
  | foo.py
)
'''